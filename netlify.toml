# Netlify Configuration for Hotel Premier QR Menu
[build]
  publish = "."

[build.processing]
  skip_processing = true

# Completely disable Netlify Drawer / Feedback badge on all deploys
[build.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_BADGE = "false"

[context.production.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_BADGE = "false"

[context.deploy-preview.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_BADGE = "false"

[context.branch-deploy.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_BADGE = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Netlify-Drawer = "false"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

